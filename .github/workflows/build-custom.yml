name: Build Custom Firmware

on:
  workflow_dispatch:
    inputs:
      pio_env:
        description: 'PlatformIO environment'
        required: true
        default: 'nrf52_promicro_diy_tcxo'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ inputs.pio_env }}

      - name: List build outputs
        run: |
          echo "=== .pio/build ==="
          ls -la .pio/build/${{ inputs.pio_env }}/ || true
          echo "=== release ==="
          ls -la release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.pio_env }}
          path: |
            release/*
            .pio/build/${{ inputs.pio_env }}/firmware.*
